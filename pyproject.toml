[tool.ruff]
# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]

# Same as Black.
line-length = 88
indent-width = 4

target-version = "py37"

[tool.ruff.lint]
# Enable Pyflakes (`F`) and a subset of the pycodestyle (`E`)  codes by default.
# Unlike Flake8, Ruff doesn't enable pycodestyle warnings (`W`) or
# McCabe complexity (`C901`) by default.
select = ["E4", "E7", "E9", "F"]
ignore = []

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

# Enable auto-formatting of code examples in docstrings. Markdown,
# reStructuredText code/literal blocks and doctests are all supported.
#
# This is currently disabled by default, but it is planned for this
# to be opt-out in the future.
docstring-code-format = false

# Set the line length limit used when formatting code snippets in
# docstrings.
#
# This only has an effect when the `docstring-code-format` setting is
# enabled.
docstring-code-line-length = "dynamic"

[build-system]
requires = ["setuptools>=77", "wheel", "torch"]
build-backend = "setuptools.build_meta"

# Not published as a conda package: the MonoGS licence (LICENSE.md, Imperial College London) is personal to the
# licensee and does not allow transferring copies to third parties. Users build it from source (pixi run install).
[project]
name = "monogs"
version = "1.1"
description = "Gaussian Splatting SLAM (MonoGS)"
readme = "README.md"
license = "LicenseRef-MonoGS"
license-files = ["LICENSE.md", "submodules/diff-gaussian-rasterization/LICENSE.md"]
authors = [{ name = "Hidenobu Matsuki" }, { name = "Riku Murai" }, { name = "Paul H. J. Kelly" }, { name = "Andrew J. Davison" }]
requires-python = ">=3.9"

[project.scripts]
vslamlab_monogs_mono = "vslamlab_monogs_mono:main"
vslamlab_monogs_rgbd = "vslamlab_monogs_rgbd:main"

[project.urls]
Homepage = "https://rmurai.co.uk/projects/GaussianSplattingSLAM/"
Repository = "https://github.com/VSLAM-LAB/monogs"